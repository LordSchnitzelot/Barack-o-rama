<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking App</title>
<!-- Installing to the home screen (spec 3.2, PWA): the manifest, the icons and the theme color. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#E9EEF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speaking">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#E9EEF5;--ink:#14213D;--soft:#5b6a86;--card:#fff;--blue:#2547F5;--gold:#F2B705;--line:#d3dbe8;--ok:#1a7f37;--bad:#c0152f;--guide:#0f7b6c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Avenir Next','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top)}
/* Text direction: the interface follows the interface language (dir on <html>); learning content
   always keeps its own language's direction (dir on each line), so English stays left-to-right
   in the Hebrew interface. */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 4px}
h1{font-size:22px;margin:0;flex:1}
header .pill{margin-inline-start:4px;white-space:nowrap}
/* Small phones (iPhone SE): the header buttons stay on one line. */
@media (max-width:360px){header{padding-inline:12px;gap:6px}header .pill{padding:6px 10px;font-size:13px;margin-inline-start:0}h1{font-size:19px}}
#back{display:none}
body:not([data-view="home"]) #back{display:inline-block}
#st{padding:0 16px 8px;font-size:12px;color:var(--soft);min-height:22px}
button{font:inherit;color:inherit;cursor:pointer}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.view{display:none;flex:1;flex-direction:column;min-height:0}
body[data-view="home"] #home,body[data-view="talk"] #talk,body[data-view="drills"] #drills{display:flex}
/* Home: the three modes (spec 4) */
#home{padding:8px 16px 24px;gap:12px;overflow-y:auto}
.mode{display:block;width:100%;text-align:start;border:0;border-radius:20px;padding:18px;background:var(--card);border-inline-start:6px solid var(--blue)}
.mode b{display:block;font-size:20px;margin-bottom:4px}
.mode span{color:var(--soft);font-size:14px;line-height:1.4}
.mode.g{border-inline-start-color:var(--guide)}
.mode.d{border-inline-start-color:var(--gold)}
/* Chat and Guide share one screen; Guide gets its own color so the two are easy to tell apart (spec 5.1) */
.bar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 6px}
#mode{font-weight:600;color:var(--blue)}
body[data-mode="guide"] #mode{color:var(--guide)}
body[data-mode="guide"] #talk{background:linear-gradient(#e3f2ef,var(--bg) 120px)}
body[data-mode="guide"] #mic{background:var(--guide)}
#chat{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.empty{margin:auto;text-align:center;color:var(--soft);max-width:300px;line-height:1.5}
.msg{max-width:92%;border-radius:18px;padding:12px 14px}
.user{align-self:flex-end;background:var(--ink);color:#fff;border-end-end-radius:6px}
.user.live{opacity:.65}
.tutor,.say{align-self:flex-start;background:var(--card);border-end-start-radius:6px;display:flex;flex-direction:column;gap:10px}
.say{border-inline-start:4px solid var(--gold)}
.line{display:flex;align-items:flex-start;gap:6px;line-height:1.45}
.line .t{flex:1;text-align:start}
.en .t{font-size:18px}
.he .t{font-size:16px;color:var(--soft)}
/* The translation's play button lines up with the English buttons, at the same edge. */
.he{flex-direction:row-reverse}
/* A hidden subtitle is blurred and revealed by tapping it (spec 5.6) */
.line.hide:not(.shown) .t{filter:blur(6px);cursor:pointer;user-select:none}
.w{border-bottom:2px solid var(--gold);cursor:pointer}
.ic{border:0;background:#eef1fb;color:var(--blue);width:32px;height:32px;border-radius:50%;flex:none;font-size:12px}
.big{font-size:20px}
.note{font-size:13px;color:var(--soft);margin:0}
.he-live{font-size:18px;margin:0;text-align:start}
footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
#mic,.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:13px;font-weight:600;flex:none}
#mic.rec,.mic.rec{background:var(--bad);animation:p 1.1s infinite}
@keyframes p{50%{box-shadow:0 0 0 12px rgba(192,21,47,.18)}}
@media (prefers-reduced-motion:reduce){#mic.rec,.mic.rec{animation:none}}
#say.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
select,input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
label{display:block;font-size:14px;margin-top:12px;margin-bottom:4px;color:var(--soft)}
#sp{width:auto;padding:7px 8px;font-size:14px}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,420px);max-height:88vh;color:var(--ink)}
dialog::backdrop{background:rgba(20,33,61,.45)}
dialog h2,dialog h3{margin:0 0 6px}
dialog h3{margin-top:14px;font-size:16px}
dialog ul{padding-inline-start:20px;margin:6px 0}
dialog li{margin:6px 0}
/* Settings is long, so it has sections and its Save button stays in view. */
#set{padding-bottom:0}
#set h3{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
#set h3:first-of-type{border-top:0;padding-top:0;margin-top:8px}
#set .close{position:sticky;bottom:0;margin:20px -20px 0;width:calc(100% + 40px);border-radius:0;padding:14px}
.mean{font-size:18px;margin:4px 0 12px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row span{flex:1}
.sc{color:var(--soft)}
.close{margin-top:16px;width:100%;padding:11px;border-radius:12px;border:0;background:var(--ink);color:#fff}
#toast{position:fixed;inset:auto 16px 120px 16px;width:auto;height:auto;max-width:528px;margin:0 auto;border:0;background:var(--bad);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:10}
#toast.good{background:var(--ok)}
#toast[hidden]{display:none}
#toast button{margin-inline-start:10px;background:#fff;color:var(--ink);border:0}
/* Drills (spec 6) */
#drills{padding:0 16px 16px;overflow-y:auto}
.card{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.card .kind{font-size:13px;color:var(--soft)}
.prompt{font-size:26px;line-height:1.35;margin:0}
.center{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}
.verdict{font-size:18px;font-weight:600}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.verdict.maybe{color:#9a6700}
.progress{font-size:13px;color:var(--soft);text-align:center}
.tok{border-bottom:1px dotted var(--soft);cursor:pointer}
.tok.hinted{background:#fff5d6}
</style>
</head>
<body data-view="home">
<header>
  <button class="pill" id="back" data-t="app.backArrow" data-t-aria="app.back"></button>
  <h1 id="title"></h1>
  <button class="pill" id="wb"></button><button class="pill" id="sb" data-t="app.settings"></button>
</header>
<div id="st" role="status"></div>

<main id="home" class="view">
  <button class="mode" data-go="chat"><b data-t="home.chat"></b><span data-t="home.chatDesc"></span></button>
  <button class="mode g" data-go="guide"><b data-t="home.guide"></b><span data-t="home.guideDesc"></span></button>
  <button class="mode d" data-go="drills"><b data-t="home.drills"></b><span data-t="home.drillsDesc"></span></button>
</main>

<section id="talk" class="view">
  <div class="bar"><span id="mode"></span><button class="pill" id="end" data-t="talk.end"></button></div>
  <div id="chat"></div>
  <footer>
    <button class="pill" id="say"></button>
    <button id="mic"></button>
    <select id="sp" data-t-aria="talk.speed"><option value="0.75" data-t="speed.slow"></option><option value="0.9" data-t="speed.easy"></option><option value="1" data-t="speed.normal"></option></select>
  </footer>
</section>

<section id="drills" class="view"></section>

<div id="toast" role="alert" popover="manual" hidden></div>

<dialog id="set">
  <h2 data-t="set.title"></h2>

  <h3 data-t="set.learning"></h3>
  <label for="ui" data-t="set.uiLang"></label>
  <select id="ui"><option value="en">English</option><option value="he">עברית</option></select>
  <label data-t="set.languages"></label>
  <p class="note" data-t="set.languagesNote"></p>
  <label for="se" data-t="set.en"></label>
  <select id="se"><option value="show" data-t="set.show"></option><option value="hide" data-t="set.hide"></option></select>
  <label for="sh" data-t="set.he"></label>
  <select id="sh"><option value="show" data-t="set.show"></option><option value="hide" data-t="set.hide"></option></select>
  <label for="co" data-t="set.corrections"></label>
  <select id="co"><option value="live" data-t="set.corrLive"></option><option value="end" data-t="set.corrEnd"></option><option value="off" data-t="set.corrOff"></option></select>
  <label for="lv" data-t="set.level"></label>
  <select id="lv"><option value="beginner" data-t="set.beginner"></option><option value="intermediate" data-t="set.intermediate"></option><option value="advanced" data-t="set.advanced"></option></select>
  <label data-t="set.talking"></label>
  <p class="note" data-t="set.talkingNote"></p>

  <h3 data-t="set.voiceHead"></h3>
  <label for="sp2" data-t="set.speed"></label>
  <select id="sp2"><option value="0.75" data-t="speed.slow"></option><option value="0.9" data-t="speed.easy"></option><option value="1" data-t="speed.normal"></option></select>
  <label for="vo" data-t="set.voice"></label>
  <select id="vo"></select>
  <div class="btns"><button class="pill" id="vtry" data-t="set.tryVoice"></button></div>
  <label for="rb" data-t="set.rateBy"></label>
  <select id="rb"><option value="phonon" data-t="set.ratePhonon"></option><option value="browser" data-t="set.rateBrowser"></option></select>

  <h3 data-t="set.ai"></h3>
  <label for="pv" data-t="set.provider"></label>
  <select id="pv"><option value="groq" data-t="set.groqFree"></option><option value="gemini">Gemini</option></select>
  <label for="rk" data-t="set.groqKey"></label><input id="rk" type="password" autocomplete="off" dir="ltr">
  <label for="gm" data-t="set.groqModel"></label><input id="gm" data-t-ph="set.auto" dir="ltr">
  <label for="gk" data-t="set.geminiKey"></label><input id="gk" type="password" autocomplete="off" dir="ltr">
  <label for="mo" data-t="set.geminiModel"></label><input id="mo" dir="ltr">
  <p class="note" style="margin-top:12px" data-t="set.keyNote"></p>

  <h3 data-t="set.data"></h3>
  <p class="note" data-t="set.dataNote"></p>
  <p class="note" id="dstats" style="margin-top:6px"></p>
  <div class="btns"><button class="pill" id="bexp" data-t="set.export"></button><button class="pill" id="bimp" data-t="set.import"></button></div>
  <input type="file" id="bfile" accept=".json,application/json" hidden>

  <h3 data-t="set.install"></h3>
  <p class="note" id="iyes" data-t="set.installed" hidden></p>
  <div id="ino">
    <p class="note" data-t="set.installNote"></p>
    <div class="btns" id="ibtnrow" hidden><button class="pill" id="ibtn" data-t="set.installBtn"></button></div>
    <p class="note" style="margin-top:8px" data-t="set.installIos"></p>
    <p class="note" style="margin-top:8px" data-t="set.installAndroid"></p>
  </div>

  <h3 data-t="set.about"></h3>
  <p class="note" data-t="set.credits"></p>

  <button class="close" id="save" data-t="set.save"></button>
</dialog>
<dialog id="wd"></dialog>
<dialog id="wl"></dialog>
<dialog id="sum"></dialog>

<script type="module" src="app.js"></script>
</body>
</html>
