<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drills Content Check</title>
<style>
  :root { --bg: #fff; --fg: #1b1b1b; --muted: #666; --ok: #1a7f37; --bad: #c62828; --warn: #9a6700; --card: #f4f4f4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #eee; --muted: #aaa; --ok: #4ac26b; --bad: #ff6b6b; --warn: #e3b341; --card: #1e1e1e; }
  }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.3em; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  #verdict { font-size: 1.2em; font-weight: 600; padding: 12px; border-radius: 8px; background: var(--card); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  ul { padding-left: 20px; } li { margin: 6px 0; overflow-wrap: anywhere; }
  #stats { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Drills content check</h1>
  <p>Checks the two dictionaries and the tagged sentences against the rules in SPEC.md section 3.3.</p>
  <div id="verdict">Checking…</div>
  <div id="stats"></div>
  <ul id="list"></ul>
</main>
<script src="validate-drills.js"></script>
<script>
(async function () {
  const dir = new URLSearchParams(location.search).get('pack') || '../packs/en-he/drills/';
  const verdict = document.getElementById('verdict');
  const list = document.getElementById('list');
  const get = f => fetch(dir + f, { cache: 'no-store' }).then(r => {
    if (!r.ok) throw new Error(f + ': ' + r.status);
    return r.json();
  });
  let r;
  try {
    const [en, he, sentences] = await Promise.all([get('dictionary-en.json'), get('dictionary-he.json'), get('sentences.json')]);
    r = DrillsValidator.validate({ en, he }, sentences);
  } catch (e) {
    verdict.textContent = 'Could not load the files: ' + e.message;
    verdict.className = 'bad';
    return;
  }
  verdict.textContent = r.errors.length
    ? r.errors.length + ' problem(s) found'
    : 'All rules pass' + (r.warnings.length ? ' (' + r.warnings.length + ' warning(s))' : '');
  verdict.className = r.errors.length ? 'bad' : 'ok';
  const s = r.stats;
  document.getElementById('stats').textContent =
    'English: ' + s.en.groups + ' groups, ' + s.en.entries + ' entries. ' +
    'Hebrew: ' + s.he.groups + ' groups, ' + s.he.entries + ' entries. ' +
    'Sentences: ' + s.sentences + '.';
  for (const [items, cls] of [[r.errors, 'bad'], [r.warnings, 'warn']]) {
    for (const t of items) {
      const li = document.createElement('li');
      li.className = cls;
      li.textContent = t;
      list.appendChild(li);
    }
  }
})();
</script>
</body>
</html>
